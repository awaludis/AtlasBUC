<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2B2A">
<title>Atlas BUC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --panel:#F8FAF8; --panel2:#E6EBE8; --ink:#1D2B2A; --ink2:#50605D; --line:#C9D2CF; --line2:#9AA8A5;
  --low:#5E8C6A; --mid:#D8A657; --high:#B5483B; --link:#2E5E86; --chip:#E1E7E4; --ok:#3F7D55; --warn:#A8741F; --bad:#B5483B;
  --manual:#B5483B; --sheet:#D8A657; --app:#5E8C6A; --mixed:#8C7AA6; --unk:#AAB5B2; --focus:#2E5E86;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A19; --panel:#1C2423; --panel2:#232D2B; --ink:#E4EAE7; --ink2:#A3B1AD; --line:#33403D; --line2:#56645F;
    --low:#6FA67C; --mid:#E0B366; --high:#D0634F; --link:#7FB0DA; --chip:#26302E; --ok:#6FB384; --warn:#E0B366; --bad:#E07A66;
    --manual:#D0634F; --sheet:#E0B366; --app:#6FA67C; --mixed:#A994C4; --unk:#6B7874; --focus:#7FB0DA;
  }
}
:root[data-theme="dark"]{
  --bg:#141A19; --panel:#1C2423; --panel2:#232D2B; --ink:#E4EAE7; --ink2:#A3B1AD; --line:#33403D; --line2:#56645F;
  --low:#6FA67C; --mid:#E0B366; --high:#D0634F; --link:#7FB0DA; --chip:#26302E; --ok:#6FB384; --warn:#E0B366; --bad:#E07A66;
  --manual:#D0634F; --sheet:#E0B366; --app:#6FA67C; --mixed:#A994C4; --unk:#6B7874; --focus:#7FB0DA;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;font-variation-settings:"wdth" 100}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--link)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;align-self:start;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:800;font-size:26px;line-height:1;font-variation-settings:"wdth" 64;letter-spacing:-.01em}
.brand small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2);font-variation-settings:"wdth" 100;margin-top:6px;letter-spacing:0}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.primary:hover{opacity:.9}
.primary[disabled]{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--line2);border-radius:6px;padding:7px 12px;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.danger{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:7px 12px;cursor:pointer}
.small{font-size:13px;padding:4px 9px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:baseline;text-decoration:none;color:var(--ink2);padding:6px 10px;border-radius:5px}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a .n{font-size:12px;opacity:.8}
.navgroup{font-size:12px;color:var(--ink2);margin:10px 10px 2px}
.store{margin-top:auto;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.topbar{display:none}
main{padding:22px 28px 90px;min-width:0}
.pagehead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
h1{margin:0;font-weight:800;font-size:clamp(26px,3.6vw,38px);line-height:1.05;font-variation-settings:"wdth" 70;letter-spacing:-.01em}
h2{font-size:20px;margin:22px 0 8px;font-variation-settings:"wdth" 80}
h3{font-size:16px;margin:16px 0 6px}
.sub{color:var(--ink2);font-size:14px;margin-top:4px}
.muted{color:var(--ink2)}
.note{font-size:13.5px;color:var(--ink2);max-width:78ch}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-weight:700;font-variation-settings:"wdth" 75;line-height:1}
.stat span{font-size:12.5px;color:var(--ink2)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input.txt,select.txt,textarea.txt{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;font-size:14.5px;width:100%;color:var(--ink)}
textarea.txt{min-height:70px;resize:vertical;line-height:1.45}
input.txt:focus,select.txt:focus,textarea.txt:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 0 12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.grad{display:inline-block;width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--low),var(--mid),var(--high));vertical-align:1px;margin:0 6px}
.banner{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.banner.warn{border-color:var(--warn)}
.empty{border:1px dashed var(--line2);border-radius:8px;padding:28px;text-align:left;max-width:640px}
.empty h2{margin-top:0}
/* map */
.district{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.district:first-of-type{border-top:0}
.dname{font-size:21px;font-weight:700;line-height:1.1;font-variation-settings:"wdth" 68}
.dname small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2);font-variation-settings:"wdth" 100;margin-top:4px}
.blocks{display:flex;flex-wrap:wrap;gap:10px}
.block{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:10px 12px 12px;cursor:pointer;text-align:left;min-width:150px;flex:1 1 170px;max-width:300px;border-left:8px solid var(--need)}
.block:hover{border-color:var(--ink);border-left-color:var(--need)}
.block .code{font-size:26px;font-weight:800;font-variation-settings:"wdth" 62;line-height:1}
.block .nm{font-weight:600;font-size:14px;margin:2px 0 8px;line-height:1.25}
.block .meta{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--chip)}
.bar span{display:block;height:100%}
.need{position:absolute;top:9px;right:10px;font-size:13px;font-weight:700;font-variation-settings:"wdth" 75}
.need small{font-weight:400;color:var(--ink2)}
.tiny{font-size:11.5px;color:var(--ink2);margin-top:6px}
/* graph */
.graphbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto;padding:8px}
.graphbox svg{display:block}
svg text{font-family:"Archivo",system-ui,sans-serif;fill:var(--ink)}
.node rect.bg{fill:var(--panel);stroke:var(--line2);stroke-width:1}
.node.ext rect.bg{fill:var(--bg);stroke-dasharray:4 3}
.node.sel rect.bg{stroke:var(--ink);stroke-width:2.5}
.node:hover rect.bg{stroke:var(--ink)}
.node{cursor:pointer}
.edge{fill:none;stroke:var(--link);stroke-width:1.4;opacity:.8}
.edge.weak{stroke-dasharray:5 4;opacity:.6}
.edge.cross{stroke:var(--line2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.detail{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:16px 18px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.detail h3{margin:0 0 2px;font-size:20px;line-height:1.2;font-variation-settings:"wdth" 80}
.gid{font-weight:800;font-variation-settings:"wdth" 62;font-size:16px;color:var(--ink2)}
.detail h4,.card h4{margin:14px 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.detail ol,.detail ul{margin:0;padding-left:20px}
.detail li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border-radius:4px;padding:2px 7px;font-size:13px}
.chip b{font-variation-settings:"wdth" 70;margin-left:5px}
.lnk{background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit;text-align:left}
.badge{display:inline-block;font-size:11.5px;border-radius:3px;padding:0 6px;border:1px solid var(--line2);color:var(--ink2);vertical-align:1px}
.badge.draft{border-color:var(--warn);color:var(--warn)}
.badge.approved{border-color:var(--ok);color:var(--ok)}
/* tables */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;font-size:13.5px}
.tablebox table:not(.crud){width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--ink2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.crud th.col{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:500;padding:8px 4px;font-size:12px;color:var(--ink)}
.crud td.c{text-align:center;font-weight:700;font-variation-settings:"wdth" 70;min-width:26px;padding:4px 2px}
.crud td.c.C{background:color-mix(in srgb,var(--link) 28%,transparent)}
.crud td.c.U{background:color-mix(in srgb,var(--mid) 30%,transparent)}
.crud td.c.R{color:var(--ink2);font-weight:400}
.crud tr.sys td{background:var(--chip);font-weight:600}
.crud th.sysh{font-size:11.5px;text-align:center;border-left:2px solid var(--ink)}
.crud .bl{border-left:2px solid var(--ink)}
.crud td.rowh{white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:14px 16px}
.card h3{margin:0;font-size:17px;font-variation-settings:"wdth" 78}
.gaps section{margin:0 0 22px}
.gaps li{margin:3px 0;font-size:14px}
/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.form section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.form section > h2{margin:0 0 10px;font-size:16px;font-variation-settings:"wdth" 85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px 14px}
.row{margin-bottom:10px}
.listed{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:start}
.li .num{font-weight:700;color:var(--ink2);padding-top:8px;text-align:right;font-variation-settings:"wdth" 70}
.li .acts{display:flex;gap:2px;padding-top:3px}
.icon{background:none;border:1px solid transparent;border-radius:4px;cursor:pointer;padding:3px 6px;color:var(--ink2);line-height:1}
.icon:hover{border-color:var(--line2);color:var(--ink)}
.io{border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;grid-template-columns:minmax(140px,2fr) minmax(90px,1fr) minmax(180px,1.7fr) auto;gap:6px;align-items:start;background:var(--bg)}
.io.withtype{grid-template-columns:minmax(140px,2fr) minmax(120px,1.1fr) minmax(90px,1fr) minmax(180px,1.7fr) auto}
.io .party{display:flex;gap:4px}
.io .party select{width:auto;flex:0 0 auto}
.io .party input{flex:1;min-width:70px}
.conn{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:14px 16px}
.conn h2{margin:0 0 4px;font-size:16px}
.conn ul{list-style:none;margin:0;padding:0}
.conn li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.conn li:last-child{border-bottom:0}
.st{font-weight:700;margin-right:4px}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.ext{color:var(--ink2)}
.savebar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(4px);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:6px;z-index:3}
.err{color:var(--bad);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:90vw}
.searchbox{position:relative}
.results{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:6px;max-height:300px;overflow:auto;width:100%;min-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 10px;cursor:pointer;font-size:13.5px}
.results button:hover{background:var(--chip)}
.drafts .card{border-left:6px solid var(--mid)}
pre.out{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12.5px;max-height:320px;overflow:auto}
.fab{display:none}
@media (max-width:1100px){
  .editor{grid-template-columns:1fr}
  .conn{position:static;max-height:none}
  .two{grid-template-columns:1fr}
  .detail{position:static;max-height:none}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 25% 0 0;z-index:40;transform:translateX(-105%);transition:transform .2s;height:100%;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
  .topbar .brand{font-size:21px}
  main{padding:16px 14px 90px}
  .district{grid-template-columns:1fr;gap:8px}
  .grid2,.grid3{grid-template-columns:1fr}
  .io,.io.withtype{grid-template-columns:1fr 1fr}
  .io .nm{grid-column:1/-1}
  .fab{display:block;position:fixed;right:16px;bottom:18px;z-index:35;border-radius:28px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
}
body.editing .fab{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar"><button class="icon" id="menuBtn" aria-label="Buka menu" style="font-size:20px">☰</button><div class="brand">Atlas BUC</div></div>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">Atlas BUC<small id="orgName">Pencatatan BUC dari wawancara</small></div>
    <button class="primary" data-go="#/new">+ BUC baru</button>
    <nav class="nav" id="nav"></nav>
    <div class="store" id="storeInfo"><span class="dot" style="background:var(--unk)"></span>Menghubungkan penyimpanan…</div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<button class="primary fab" data-go="#/new">+ BUC</button>
<datalist id="dl-domains"></datalist><datalist id="dl-pas"></datalist><datalist id="dl-actors"></datalist><datalist id="dl-arts"></datalist><datalist id="dl-parties"></datalist><datalist id="dl-apps"></datalist>
<script>
(function(){
'use strict';
// ================= utils =================
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
const uid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const nowIso = () => new Date().toISOString();
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function ratio(a, b){ // similarity 0..1 (Levenshtein based)
  a = norm(a); b = norm(b); if(!a || !b) return 0; if(a===b) return 1;
  const m=a.length, n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return 1 - prev[n]/Math.max(m,n);
}
const SUFFIX = new Set(['form','sheet','checklist','slip','register','record','certificate','note','letter','list','card','label','document','file','log','book']);
const ENTITY_TYPES = ['Transaction Data','Master Data','Reference Data','Approval Record','Attachment','Status History','Log Record','Report Record'];
const SHARED_TYPES = new Set(['master data','reference data']);
const DEADEND_OK = new Set(['report record','log record','status history','attachment']);
const SUPPORT = ['Manual','Spreadsheet','Application','Mixed','Not performed','Unknown'];
const SUP_LABEL = {Manual:'Manual', Spreadsheet:'Spreadsheet', Application:'Aplikasi', Mixed:'Campuran', 'Not performed':'Belum dijalankan', Unknown:'Belum diketahui'};
const SUP_VAR = {Manual:'--manual', Spreadsheet:'--sheet', Application:'--app', Mixed:'--mixed', 'Not performed':'--manual', Unknown:'--unk'};
const SUP_W = {Manual:1, 'Not performed':1, Spreadsheet:.7, Mixed:.5, Unknown:.5, Application:0};
const REVIEW = {draft:'Draf', reviewed:'Ditinjau', approved:'Disetujui'};
const seqOf = code => { const m = /-(\d+)$/.exec(code || ''); return m ? +m[1] : 999; };

// ================= state =================
const S = {
  mode: 'loading',            // loading | shared | local
  bucs: new Map(),            // docId -> buc
  settings: {org:'', domains:{}, doc2ent:{}},
  caps: {db:null, user:null, sample:null, downloads:null},
  me: {id:null, name:''}, names: {}, canWrite: true,
  repo: null, layer: 'all', aiDrafts: [], editing: null,
};
window.__ATLAS = S; // debugging aid

// ================= storage =================
const LS_KEY = 'atlas-buc-v1';
const Store = {
  listeners: [],
  onChange(fn){ this.listeners.push(fn); },
  emit(){ S.repo = null; this.listeners.forEach(f => f()); },
  loadLocal(){
    try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d = JSON.parse(raw); S.bucs = new Map(Object.entries(d.bucs || {})); S.settings = Object.assign({org:'',domains:{},doc2ent:{}}, d.settings || {}); } }catch(e){}
  },
  persistLocal(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({bucs:Object.fromEntries(S.bucs), settings:S.settings})); }catch(e){ toast('Penyimpanan lokal penuh atau tidak tersedia.'); }
  },
  async init(){
    const hasClaude = typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function';
    if(!hasClaude){ this.useLocal(); return; }
    const [db, user, sample, downloads] = await Promise.all(['db','user','sample','downloads'].map(n => window.claude.use(n).catch(()=>null)));
    S.caps = {db, user, sample, downloads};
    if(user){
      try{ const me = await user.me(); S.me = {id: me.id, name: me.name}; }catch(e){}
      try{ const c = await user.can('data.write'); if(c === false) S.canWrite = false; }catch(e){}
    }
    if(!db){ this.useLocal(); return; }
    S.mode = 'shared';
    db.collection('bucs').onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => { if(d.exists) m.set(d.id, clone(d.data())); });
      S.bucs = m; this.emit(); resolveNames();
    }, err => { if(err && err.code === 'revoked'){ S.canWrite = false; } toast('Sinkronisasi terputus: ' + (err && err.code || 'galat')); });
    db.doc('settings/main').onSnapshot(snap => {
      S.settings = Object.assign({org:'',domains:{},doc2ent:{}}, snap.exists ? clone(snap.data()) : {});
      this.emit();
    }, ()=>{});
    this.emit();
  },
  useLocal(){ S.mode = 'local'; this.loadLocal(); this.emit(); registerPWA(); },
  async saveBuc(id, buc){
    buc.updatedAt = nowIso(); if(S.me.id) buc.updatedBy = S.me.id;
    if(!buc.createdAt){ buc.createdAt = buc.updatedAt; if(S.me.id) buc.createdBy = S.me.id; }
    if(S.mode === 'shared'){
      try{ await S.caps.db.collection('bucs').doc(id).set(buc); }
      catch(e){ return this.fail(e); }
      S.bucs.set(id, buc); this.emit(); return true;
    }
    S.bucs.set(id, buc); this.persistLocal(); this.emit(); return true;
  },
  async deleteBuc(id){
    if(S.mode === 'shared'){ try{ await S.caps.db.collection('bucs').doc(id).delete(); }catch(e){ return this.fail(e); } }
    S.bucs.delete(id); if(S.mode==='local') this.persistLocal(); this.emit(); return true;
  },
  async saveSettings(patch){
    const next = Object.assign({}, S.settings, patch);
    if(S.mode === 'shared'){ try{ await S.caps.db.doc('settings/main').set(next); }catch(e){ return this.fail(e); } }
    S.settings = next; if(S.mode==='local') this.persistLocal(); this.emit(); return true;
  },
  async bulk(ops){ // [{id, buc}|{id, del:true}] sequential (one write per doc)
    let ok = 0;
    for(const op of ops){
      if(op.del){ if(await this.deleteBuc(op.id)) ok++; }
      else if(await this.saveBuc(op.id, op.buc)) ok++;
    }
    return ok;
  },
  fail(e){
    const code = e && e.code;
    if(code === 'invalid_argument'){ S.canWrite = false; toast('Anda hanya punya akses baca pada data bersama ini.'); }
    else if(code === 'quota_exceeded') toast('Kapasitas penyimpanan penuh (maks. 5.000 dokumen). Hapus BUC yang tidak dipakai.');
    else if(code === 'resource_exhausted') toast('Terlalu banyak penyimpanan sekaligus. Coba lagi sebentar lagi.');
    else toast('Gagal menyimpan (' + (code || 'galat') + '). Coba lagi.');
    return false;
  }
};

function registerPWA(){

// ================= model helpers =================
function blankBuc(layer){
  return {code:'', name:'', layer: layer || 'manual', domain:'', pa:'', paCode:'', actor:'', goal:'', startEvent:'',
    flow:[''], inputs:[], outputs:[], rules:[], support:'Manual', supportApp:'', pains:[], replaces:[],
    source:{interviewee:'', role:'', date:new Date().toISOString().slice(0,10)}, review:'draft'};
}
function normalizeBuc(b){
  const x = Object.assign(blankBuc(b.layer), b);
  x.flow = (x.flow || []).filter(s => String(s).trim()); x.rules = (x.rules||[]).filter(s=>String(s).trim()); x.pains = (x.pains||[]).filter(s=>String(s).trim());
  const io = r => ({name:String(r.name||'').trim(), type:r.type||'', status:String(r.status||'').trim(), party:String(r.party||'').trim(), filed:!!r.filed});
  x.inputs = (x.inputs||[]).map(io).filter(r=>r.name); x.outputs = (x.outputs||[]).map(io).filter(r=>r.name);
  x.replaces = (x.replaces||[]).filter(r=>r.document && r.entity);
  x.paCode = String(x.paCode||'').toUpperCase(); x.code = String(x.code||'').toUpperCase();
  return x;
}
function deriveCode(name, used){
  const w = (String(name).toUpperCase().match(/[A-Z]+/g) || []);
  const c = [];
  if(w.length >= 3) c.push(w.slice(0,3).map(x=>x[0]).join(''));
  if(w.length === 2){ c.push(w[0].slice(0,2)+w[1][0]); c.push(w[0][0]+w[1].slice(0,2)); }
  if(w.length){ const cons = w[0][0] + w[0].slice(1).replace(/[AEIOU]/g,''); c.push(cons.slice(0,3), w[0].slice(0,3)); }
  for(const x of c) if(x.length===3 && !used.has(x)) return x;
  const base=(w[0]||'PAX').slice(0,2); for(const ch of 'XYZQWKJV') if(!used.has(base+ch)) return base+ch;
  return 'P'+used.size;
}
function paCodeMap(){ // pa name(norm) -> code (most common)
  const cnt = {}; for(const b of S.bucs.values()){ if(!b.pa || !b.paCode) continue; const k = norm(b.pa); (cnt[k] = cnt[k] || {})[b.paCode] = ((cnt[k]||{})[b.paCode] || 0) + 1; }
  const m = {}; for(const k in cnt) m[k] = Object.entries(cnt[k]).sort((a,b)=>b[1]-a[1])[0][0]; return m;
}
function nextCode(code, excludeId){
  let max = 0; for(const [id,b] of S.bucs) if(id!==excludeId && (b.code||'').startsWith(code+'-')) max = Math.max(max, seqOf(b.code));
  return code + '-' + String(max+1).padStart(2,'0');
}
function vocab(){
  const v = {domains:{}, pas:{}, actors:{}, arts:{}, parties:{}, apps:{}};
  const add = (o,k,extra) => { if(!k) return; const n = norm(k); o[n] = o[n] || {name:k, count:0, ...extra}; o[n].count++; return o[n]; };
  for(const b of S.bucs.values()){
    add(v.domains, b.domain); const p = add(v.pas, b.pa, {code:b.paCode, domain:b.domain}); if(p && !p.code) p.code=b.paCode;
    add(v.actors, b.actor);
    for(const r of [...(b.inputs||[]), ...(b.outputs||[])]){
      const a = add(v.arts, r.name, {statuses:new Set(), types:new Set(), layers:new Set()}); if(!a) continue;
      if(r.status) a.statuses.add(r.status); if(r.type) a.types.add(r.type); a.layers.add(b.layer);
      if(r.party) add(v.parties, r.party);
    }
    if(b.support==='Application' && b.supportApp) add(v.apps, b.supportApp);
  }
  return v;
}

// ================= analysis engine (port of buc-integrator) =================
function crudOf(b){
  const m = new Map(); const inN = new Set((b.inputs||[]).map(x=>norm(x.name)));
  for(const x of [...(b.inputs||[]), ...(b.outputs||[])]){ const k = norm(x.name); if(!m.has(k)) m.set(k, {name:x.name, type:x.type||'', kind:b.layer==='computerized'?'entity':'document', u:new Set()}); const e=m.get(k); if(!e.type && x.type) e.type=x.type; }
  for(const x of b.inputs||[]) m.get(norm(x.name)).u.add('R');
  for(const x of b.outputs||[]){
    const e = m.get(norm(x.name));
    if(x.filed){ e.u.add('A'); continue; }
    if(/^(cancel|void|delet)/i.test(x.status||'')) e.u.add('D');
    e.u.add(inN.has(norm(x.name)) ? 'U' : 'C');
  }
  return [...m.values()].map(e => ({...e, usage:'CRUDA'.split('').filter(c=>e.u.has(c)).join('')}));
}
function analyze(){
  if(S.repo) return S.repo;
  const all = [...S.bucs.entries()].map(([id,b]) => ({id, ...normalizeBuc(b)}));
  const bucs = all.filter(b => S.layer==='all' || b.layer===S.layer);
  const byId = Object.fromEntries(bucs.map(b=>[b.id,b]));
  const doc2ent = Object.assign({}, S.settings.doc2ent || {});
  for(const b of all) for(const r of b.replaces) doc2ent[r.document] = r.entity;
  const d2e = {}; for(const k in doc2ent) d2e[norm(k)] = doc2ent[k];
  const st = x => norm(x.status);
  const typeOf = x => norm(x.type);
  const gaps = {status_mismatch:[], no_producer:[], no_master_owner:[], dead_end:[], isolated:[], incomplete:[], naming:[], unmapped:[]};
  // output index
  const outIdx = new Map();
  for(const b of bucs) for(const o of b.outputs){ if(o.party || o.filed) continue; const k = b.layer+'|'+norm(o.name); if(!outIdx.has(k)) outIdx.set(k, []); outIdx.get(k).push({b, o}); }
  const links = []; const has = new Set();
  const addLink = (from, to, label, kind, layer) => { const k = from+'>'+to; if(from===to || has.has(k)) return; has.add(k); links.push({from, to, label, kind, layer}); };
  for(const b of bucs){
    for(const i of b.inputs){
      if(i.party || SHARED_TYPES.has(typeOf(i))) continue;
      const cands = (outIdx.get(b.layer+'|'+norm(i.name)) || []).filter(c => c.b.id !== b.id);
      if(!cands.length) continue;
      const exact = st(i) ? cands.filter(c => st(c.o) === st(i)) : [];
      const compat = exact.length ? exact : cands.filter(c => !st(i) || !st(c.o));
      if(!compat.length){ gaps.status_mismatch.push({buc:b.id, artifact:i.name, needs:i.status, available:[...new Set(cands.map(c=>c.o.status||''))]}); continue; }
      let prods = [...new Set(compat.map(c=>c.b.id))];
      let kind = (exact.length || prods.length===1) ? 'matched' : 'ambiguous';
      if(kind==='ambiguous'){
        const before = prods.filter(p => norm(byId[p].pa)===norm(b.pa) && seqOf(byId[p].code) < seqOf(b.code));
        if(before.length){ prods = [before.sort((x,y)=>seqOf(byId[y].code)-seqOf(byId[x].code))[0]]; kind='sequence'; }
      }
      for(const p of prods){ const o = compat.find(c=>c.b.id===p).o; const s = i.status || o.status; addLink(p, b.id, i.name + (s ? ' ['+s+']' : ''), kind, b.layer); }
    }
  }
  const externals = [];
  for(const b of bucs){
    for(const i of b.inputs) if(i.party) externals.push({buc:b.id, dir:'in', party:i.party, artifact:i.name});
    for(const o of b.outputs) if(o.party) externals.push({buc:b.id, dir:'out', party:o.party, artifact:o.name});
  }
  // gaps: producers
  const produced = {}; for(const b of bucs){ produced[b.layer] = produced[b.layer] || new Set(); b.outputs.forEach(o => produced[b.layer].add(norm(o.name))); }
  const np = new Map();
  for(const b of bucs) for(const i of b.inputs){
    if(i.party || (produced[b.layer]||new Set()).has(norm(i.name))) continue;
    const key = (SHARED_TYPES.has(typeOf(i)) ? 'no_master_owner' : 'no_producer') + '|' + norm(i.name);
    if(!np.has(key)) np.set(key, {key: key.split('|')[0], artifact:i.name, used_by:[]});
    np.get(key).used_by.push(b.id);
  }
  for(const it of np.values()){
    if(it.key==='no_producer'){
      const asis = all.filter(x => x.layer==='manual' && x.outputs.some(o => norm(d2e[norm(o.name)]||'')===norm(it.artifact))).map(x=>x.id);
      if(asis.length) it.as_is = asis;
    }
    gaps[it.key].push(it);
  }
  const de = new Map();
  for(const b of bucs) for(const o of b.outputs){
    if(o.party || o.filed || DEADEND_OK.has(typeOf(o)) || SHARED_TYPES.has(typeOf(o))) continue;
    if(b.inputs.some(i => norm(i.name)===norm(o.name) && st(i)===st(o))) continue;
    const used = bucs.some(x => x.layer===b.layer && x.id!==b.id && x.inputs.some(i => norm(i.name)===norm(o.name) && (!st(i) || !st(o) || st(i)===st(o))));
    if(used) continue;
    const label = o.name + (o.status ? ' ['+o.status+']' : '');
    if(!de.has(label)) de.set(label, {artifact:label, from:[]});
    de.get(label).from.push(b.id);
  }
  gaps.dead_end = [...de.values()];
  const linked = new Set([...links.flatMap(l=>[l.from,l.to]), ...externals.map(e=>e.buc)]);
  for(const b of bucs){
    if(!linked.has(b.id)) gaps.isolated.push({buc:b.id});
    const miss = [];
    if(!b.domain) miss.push('domain'); if(!b.pa) miss.push('process area'); if(!b.actor) miss.push('aktor'); if(!b.goal) miss.push('tujuan');
    if(!b.outputs.length) miss.push('output'); if(!b.flow.length) miss.push('alur utama');
    if(b.layer==='computerized' && [...b.inputs, ...b.outputs].some(r=>!r.type)) miss.push('tipe entity');
    if(miss.length) gaps.incomplete.push({buc:b.id, missing:miss});
  }
  // catalog
  const cat = new Map();
  for(const b of bucs) for(const a of crudOf(b)){
    const k = norm(a.name); if(!cat.has(k)) cat.set(k, {name:a.name, kind:a.kind, type:a.type, used_by:[]});
    const c = cat.get(k); if(!c.type && a.type) c.type = a.type; c.used_by.push({buc:b.id, usage:a.usage});
  }
  if(all.some(b=>b.layer==='computerized')){
    for(const c of cat.values()) if(c.kind==='document' && !d2e[norm(c.name)]) gaps.unmapped.push({document:c.name, used_by:c.used_by.map(u=>u.buc)});
  }
  // naming suggestions
  const similar = (names, label) => {
    const arr = [...new Set(names.filter(Boolean))].sort();
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
      const a=arr[i], b=arr[j]; if(norm(a)===norm(b)){ gaps.naming.push({cat:label, a, b, r:1}); continue; }
      if(d2e[norm(a)] && norm(d2e[norm(a)])===norm(b) || d2e[norm(b)] && norm(d2e[norm(b)])===norm(a)) continue;
      const r = ratio(a,b); const [s,l] = [norm(a),norm(b)].sort((x,y)=>x.length-y.length);
      const extra = l.split(' ').filter(w=>!s.split(' ').includes(w));
      const suf = l.startsWith(s) && extra.length && extra.every(w=>SUFFIX.has(w));
      if(r>=0.88 || suf) gaps.naming.push({cat:label, a, b, r:Math.round(r*100)/100});
    }
  };
  similar([...cat.values()].map(c=>c.name), 'dokumen/entity');
  similar(bucs.map(b=>b.pa), 'process area'); similar(bucs.map(b=>b.actor), 'aktor'); similar(bucs.map(b=>b.domain), 'domain');
  // process areas
  const codeMap = {}; const used = new Set();
  for(const b of bucs){ const k = norm(b.pa || 'Tanpa area'); if(b.paCode && !codeMap[k]){ codeMap[k] = b.paCode; used.add(b.paCode); } }
  const gapHits = {}; const hit = id => gapHits[id] = (gapHits[id]||0) + 1;
  gaps.status_mismatch.forEach(x=>hit(x.buc)); gaps.isolated.forEach(x=>hit(x.buc)); gaps.incomplete.forEach(x=>hit(x.buc));
  gaps.no_producer.forEach(x=>x.used_by.forEach(hit)); gaps.dead_end.forEach(x=>x.from.forEach(hit));
  const pas = new Map();
  for(const b of bucs){
    const k = norm(b.pa || 'Tanpa area');
    if(!pas.has(k)){ if(!codeMap[k]){ codeMap[k] = deriveCode(b.pa||'Tanpa area', used); used.add(codeMap[k]); }
      pas.set(k, {key:k, name:b.pa || 'Tanpa area', code:codeMap[k], domains:{}, bucs:[], support:{}, pains:0, gaps:0, actors:new Set(), layers:new Set()}); }
    const p = pas.get(k); p.bucs.push(b.id); p.domains[b.domain||'Tanpa domain'] = (p.domains[b.domain||'Tanpa domain']||0)+1;
    p.support[b.support||'Unknown'] = (p.support[b.support||'Unknown']||0)+1; p.pains += b.pains.length; p.gaps += gapHits[b.id]||0;
    if(b.actor) p.actors.add(b.actor); p.layers.add(b.layer);
  }
  for(const p of pas.values()){
    p.domain = Object.entries(p.domains).sort((a,b)=>b[1]-a[1])[0][0];
    const n = p.bucs.length; const gr = Object.entries(p.support).reduce((s,[k,v])=>s+(SUP_W[k]??.5)*v,0)/n;
    p.need = Math.round(70*gr + 30*Math.min(1, p.pains/(1.5*n)));
    p.bucs.sort((a,b)=>seqOf(byId[a].code)-seqOf(byId[b].code) || String(byId[a].code).localeCompare(byId[b].code));
  }
  const paOf = id => byId[id] ? pas.get(norm(byId[id].pa || 'Tanpa area')) : undefined;
  // candidate systems (data-class affinity)
  const W = {C:3, U:2, D:2, R:1, A:0};
  const dclass = n => d2e[norm(n)] || n;
  const touch = new Map(); const creators = new Map(); const dtype = {};
  for(const c of cat.values()){
    const dc = norm(dclass(c.name)); const dn = dclass(c.name);
    dtype[dc] = dtype[dc] || (cat.get(dc) && cat.get(dc).type) || c.type;
    const shared = SHARED_TYPES.has(norm(dtype[dc]));
    for(const u of c.used_by){
      const pk = paOf(u.buc).key;
      if(u.usage.includes('C')){ if(!creators.has(dc)) creators.set(dc, {name:dn, pas:new Set()}); creators.get(dc).pas.add(pk); }
      if(shared) continue;
      const w = Math.max(...u.usage.split('').map(ch=>W[ch]??1), 0);
      if(!touch.has(pk)) touch.set(pk, new Map()); const t = touch.get(pk); t.set(dc, Math.max(t.get(dc)||0, w));
    }
  }
  const parent = {}; for(const k of pas.keys()) parent[k] = k;
  const find = x => { while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  const aff = (x,y) => { const tx = touch.get(x)||new Map(), ty = touch.get(y)||new Map(); let s=0, any=false;
    for(const [d,wx] of tx){ if(!ty.has(d)) continue; any=true; const wy=ty.get(d); s += (wx>=2&&wy>=2)?3:((wx===3||wy===3)?.5:1); }
    if(!any) return 0; const sum = m => [...m.values()].reduce((a,b)=>a+b,0); return s/Math.max(1, Math.min(sum(tx), sum(ty))); };
  const keys = [...pas.keys()].sort(); const pairs = [];
  for(let i=0;i<keys.length;i++) for(let j=i+1;j<keys.length;j++) pairs.push([aff(keys[i],keys[j]), keys[i], keys[j]]);
  pairs.sort((a,b)=>b[0]-a[0]); const TH = S.settings.affinity || 0.3;
  for(const [sc,x,y] of pairs) if(sc>=TH) parent[find(x)] = find(y);
  const groups = new Map(); for(const k of pas.keys()){ const r = find(k); if(!groups.has(r)) groups.set(r, []); groups.get(r).push(k); }
  const systems = []; let si = 0;
  const domOrder = d => (S.settings.domains[d] && S.settings.domains[d].order) || 999;
  for(const members of [...groups.values()].sort((a,b)=>Math.min(...a.map(k=>domOrder(pas.get(k).domain)))-Math.min(...b.map(k=>domOrder(pas.get(k).domain))) || a[0].localeCompare(b[0]))){
    const id = 'SYS-' + String(++si).padStart(2,'0');
    members.sort((a,b)=>pas.get(a).code.localeCompare(pas.get(b).code));
    members.forEach(k => pas.get(k).system = id);
    const owns = [...creators.values()].filter(c => members.some(m=>c.pas.has(m))).map(c=>c.name).sort();
    systems.push({id, members, owns, reads:[]});
  }
  const ownerSys = {}; for(const [dc,c] of creators){ const pk=[...c.pas].sort()[0]; ownerSys[dc] = pas.get(pk).system; }
  for(const sy of systems){
    const rf = {};
    for(const k of sy.members) for(const bid of pas.get(k).bucs) for(const a of crudOf(byId[bid])){ const dc = norm(dclass(a.name)); const o = ownerSys[dc]; if(o && o!==sy.id){ (rf[o] = rf[o] || new Set()).add(dclass(a.name)); } }
    sy.reads = Object.entries(rf).map(([s,v])=>({system:s, items:[...v].sort()}));
  }
  // domains
  const doms = new Map();
  for(const p of pas.values()){ if(!doms.has(p.domain)) doms.set(p.domain, []); doms.get(p.domain).push(p); }
  const domains = [...doms.entries()].map(([name, ps]) => ({name, group:(S.settings.domains[name]||{}).group||'', order:domOrder(name), pas:ps.sort((a,b)=>b.need-a.need)})).sort((a,b)=>a.order-b.order || a.name.localeCompare(b.name));
  S.repo = {all, bucs, byId, links, externals, gaps, cat, pas, paOf, systems, domains, dclass, d2e};
  return S.repo;
}

// ================= graph layout =================
function layered(ids, edges){
  const adj = {}; ids.forEach(n=>adj[n]=[]);
  const E = edges.filter(e=>adj[e.from] && adj[e.to] && e.from!==e.to);
  E.forEach(e=>adj[e.from].push(e));
  const vis = {}, keep = [];
  const dfs = n => { vis[n]=1; for(const e of adj[n]){ if(vis[e.to]===1) continue; keep.push(e); if(!vis[e.to]) dfs(e.to); } vis[n]=2; };
  [...ids].sort().forEach(n=>{ if(!vis[n]) dfs(n); });
  const rank = {}; ids.forEach(n=>rank[n]=0);
  for(let it=0; it<ids.length; it++){ let ch=false; keep.forEach(e=>{ if(rank[e.to] < rank[e.from]+1){ rank[e.to]=rank[e.from]+1; ch=true; } }); if(!ch) break; }
  ids.forEach(n=>{ if(keep.some(e=>e.to===n)) return; const t = keep.filter(e=>e.from===n).map(e=>rank[e.to]); if(t.length) rank[n] = Math.max(0, Math.min(...t)-1); });
  const cols = {}; ids.forEach(n=>(cols[rank[n]] = cols[rank[n]] || []).push(n));
  const order = {};
  Object.keys(cols).map(Number).sort((a,b)=>a-b).forEach((r,ri)=>{
    const col = cols[r];
    const bary = n => { const ps = E.filter(e=>e.to===n && order[e.from]!==undefined).map(e=>order[e.from]); return ps.length ? ps.reduce((a,b)=>a+b)/ps.length : 999; };
    if(ri>0) col.sort((a,b)=>bary(a)-bary(b) || a.localeCompare(b)); else col.sort();
    col.forEach((n,i)=>order[n]=i);
  });
  return {rank, order, cols};
}
function wrapText(t, w, max){ const cpl = Math.floor(w/6.4), words = String(t).split(' '), lines = [''];
  for(const wd of words){ if((lines[lines.length-1]+' '+wd).trim().length > cpl){ if(lines.length===max){ lines[max-1] = lines[max-1].replace(/.?$/, '…'); break; } lines.push(wd); } else lines[lines.length-1] = (lines[lines.length-1]+' '+wd).trim(); }
  return lines; }
function graphSVG(nodes, edges, opt={}){
  const W=opt.w||200, H=opt.h||58, GX=opt.gx||70, GY=opt.gy||18;
  if(!nodes.length) return '<p class="muted" style="padding:10px">Belum ada yang bisa digambar.</p>';
  const L = layered(nodes.map(n=>n.id), edges);
  let maxR=0, maxO=0; nodes.forEach(n=>{ maxR=Math.max(maxR,L.rank[n.id]); maxO=Math.max(maxO,(L.cols[L.rank[n.id]]||[]).length-1); });
  const colH = r => (L.cols[r]||[]).length*(H+GY)-GY, totalH = (maxO+1)*(H+GY)-GY;
  const pos = {}; nodes.forEach(n=>{ const r=L.rank[n.id], o=L.order[n.id]; pos[n.id] = {x:10+r*(W+GX), y:10+(totalH-colH(r))/2+o*(H+GY)}; });
  const back = edges.some(e=>pos[e.from]&&pos[e.to]&&pos[e.to].x<=pos[e.from].x&&e.from!==e.to);
  const width = 20+(maxR+1)*(W+GX)-GX, height = 20+totalH+(back?44:0);
  let s = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(opt.label||'Diagram')}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/></marker></defs>`;
  const seen = new Set();
  edges.forEach(e=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b||e.from===e.to) return; const key=e.from+'>'+e.to; if(seen.has(key)) return; seen.add(key);
    let x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2, d;
    if(x2>x1){ const mx=(x1+x2)/2; d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2-2},${y2}`; }
    else { x1=a.x+W/2; y1=a.y+H; x2=b.x+W/2; y2=b.y+H; const dy=Math.max(y1,y2)+30; d=`M${x1},${y1} C${x1},${dy} ${x2},${dy} ${x2},${y2+2}`; }
    const lbl = [...new Set(edges.filter(x=>x.from===e.from&&x.to===e.to).map(x=>x.label).filter(Boolean))].join(', ');
    s += `<path class="edge ${e.cls||''}" d="${d}" marker-end="url(#ah)"><title>${esc(lbl)}</title></path>`; });
  nodes.forEach(n=>{ const p=pos[n.id];
    s += `<g class="node ${n.ext?'ext':''} ${n.sel?'sel':''}" tabindex="0" role="button" data-node="${esc(n.id)}" transform="translate(${p.x},${p.y})"><title>${esc(n.tip||n.title)}</title>
      <rect class="bg" width="${W}" height="${H}" rx="4"/>${n.fill?`<rect width="6" height="${H}" rx="2" style="fill:${n.fill}"/>`:''}
      <text x="14" y="20" style="font-weight:800;font-size:14px;font-variation-settings:'wdth' 62">${esc(n.head||n.id)}</text>
      ${wrapText(n.title, W-24, 2).map((t,i)=>`<text x="14" y="${36+i*14}" style="font-size:12.5px">${esc(t)}</text>`).join('')}</g>`; });
  return s + '</svg>';
}

// ================= dialogs (no native modals: they are blocked inside sandboxed frames) =================
function ask({title, body='', input=null, okLabel='OK', cancelLabel='Batal', danger=false, text=null}){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px';
    wrap.innerHTML = `<div role="dialog" aria-modal="true" aria-label="${esc(title)}" style="background:var(--panel);color:var(--ink);border-radius:8px;max-width:640px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto">
      <h2 style="margin:0 0 8px">${esc(title)}</h2>${body?`<div class="note" style="margin-bottom:10px">${body}</div>`:''}
      ${input!==null?`<input class="txt" id="dlgIn" value="${esc(input)}">`:''}
      ${text!==null?`<textarea class="txt" id="dlgTx" style="min-height:260px;font-size:12.5px" readonly>${esc(text)}</textarea>`:''}
      <div class="toolbar" style="margin:14px 0 0;justify-content:flex-end">${cancelLabel?`<button class="ghost" id="dlgNo">${esc(cancelLabel)}</button>`:''}<button class="${danger?'danger':'primary'}" id="dlgOk">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(wrap);
    const done = v => { wrap.remove(); resolve(v); };
    const inp = $('#dlgIn', wrap), tx = $('#dlgTx', wrap);
    $('#dlgOk', wrap).onclick = () => done(input!==null ? inp.value : true);
    const no = $('#dlgNo', wrap); if(no) no.onclick = () => done(input!==null ? null : false);
    wrap.addEventListener('keydown', e=>{ if(e.key==='Escape') done(input!==null?null:false); if(e.key==='Enter' && inp && document.activeElement===inp) done(inp.value); });
    (inp || tx || $('#dlgOk', wrap)).focus(); if(tx) tx.select();
  });
}
async function offerText(title, textValue, filename){
  let copied = false;
  try{ await navigator.clipboard.writeText(textValue); copied = true; }catch(e){}
  const dl = filename ? await canDownload() : false;
  const r = await ask({title, body: copied ? 'Sudah disalin ke clipboard. Isinya juga ditampilkan di bawah.' : 'Pilih semua teks di bawah lalu salin (Ctrl+C / Cmd+C).', text:textValue, okLabel: dl ? 'Simpan sebagai file' : 'Tutup', cancelLabel: dl ? 'Tutup' : ''});
  if(r && dl) saveFile(filename, textValue);
}
async function canDownload(){ return !!S.caps.downloads || S.mode==='local'; }
async function saveFile(filename, data){
  if(S.caps.downloads){ try{ await S.caps.downloads.save({filename, data}); toast('File disimpan.'); }catch(e){ if(e.code!=='declined') toast('File tidak bisa disimpan di sini ('+(e.code||'galat')+').'); } return; }
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); }catch(e){ toast('File tidak bisa disimpan di perangkat ini.'); }
}

function autoGrow(t){ t.style.height='auto'; t.style.height = Math.max(38, t.scrollHeight+2)+'px'; }
function setPath(o, path, v){ const ks = path.split('.'); let x = o; for(let i=0;i<ks.length-1;i++) x = x[ks[i]] = x[ks[i]] || {}; x[ks[ks.length-1]] = v; }
function onEdInput(e){

}

function statusOk(a, b){ return !norm(a) || !norm(b) || norm(a)===norm(b); }
function renderConn(){

        h = `<span class="st warn">!</span>` + h + `Dihasilkan oleh ${w.map(x=>`<b>${esc(x.code)}</b>`).join(', ')}, tetapi di sana ditandai dikirim ke pihak luar atau diarsip. Pastikan alurnya memang kembali ke internal.`; }

    }

  });
  const outs = [];

    if(o.party) h = `<span class="st ext">↗</span>` + h + `<span class="muted">Ke pihak luar: ${esc(o.party)}</span>`;
    else if(o.filed) h = `<span class="st ext">▣</span>` + h + `<span class="muted">Diarsip</span>`;

const AI_KEY = 'atlas-ai';
function aiConfig(){ try{ return Object.assign({mode:'off', url:'', model:'qwen3:14b'}, JSON.parse(localStorage.getItem(AI_KEY)||'{}')); }catch(e){ return {mode:'off', url:'', model:'qwen3:14b'}; } }
function saveAiConfig(c){ try{ localStorage.setItem(AI_KEY, JSON.stringify(c)); }catch(e){} }
function aiAvailable(){ if(S.caps.sample) return 'claude'; const c = aiConfig(); return (c.mode==='proxy' || c.mode==='ollama') ? c.mode : null; }
function aiLabel(){ const a = aiAvailable(); const c = aiConfig(); return a==='claude' ? 'Claude' : a==='proxy' ? 'server AI organisasi' : a==='ollama' ? `Ollama (${c.model})` : ''; }
function parseLoose(text){
  let t = String(text||'').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
  const fence = /```(?:json)?\s*([\s\S]*?)```/.exec(t); if(fence) t = fence[1].trim();
  try{ return JSON.parse(t); }catch(e){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a, b+1)); }catch(e){} }
  const err = new Error('invalid_json'); err.code = 'invalid_json'; err.text = text; throw err;
}
function aiErr(code, message){ const e = new Error(message||code); e.code = code; return e; }
async function aiJson(prompt, {signal, onText} = {}){
  const mode = aiAvailable();
  if(mode==='claude') return S.caps.sample.json(prompt, {signal, modelTier:'default', onText});
  const c = aiConfig(); let res;
  try{
    if(mode==='proxy'){
      res = await fetch(c.url || 'api/ai/draft', {method:'POST', headers:{'content-type':'application/json'}, credentials:'include', body:JSON.stringify({prompt}), signal});
    } else if(mode==='ollama'){
      res = await fetch((c.url || 'http://localhost:11434').replace(/\/+$/,'') + '/api/chat', {method:'POST', headers:{'content-type':'application/json'}, signal,
        body:JSON.stringify({model:c.model || 'qwen3:14b', stream:false, format:'json', messages:[{role:'user', content:prompt}], options:{temperature:0.2, num_ctx:16384}})});
    } else throw aiErr('not_configured');
  }catch(e){ if(e.name==='AbortError') throw aiErr('cancelled'); if(e.code) throw e; throw aiErr('network', e.message); }
  if(res.status===429) throw aiErr('rate_limited');
  if(res.status===401 || res.status===403) throw aiErr('unauthorized');
  let body; try{ body = await res.json(); }catch(e){ throw aiErr('bad_response', 'HTTP '+res.status); }
  if(!res.ok) throw aiErr(body && body.error || ('http_'+res.status), body && body.message);
  const text = mode==='ollama' ? (body.message && body.message.content) : body.text;
  if(onText) onText({text:String(text||''), delta:''});
  return parseLoose(text);
}
async function testAi(c){
  try{
    if(c.mode==='proxy'){ const u = (c.url || 'api/ai/draft').replace(/\/draft\/?$/, '/health'); const r = await fetch(u, {credentials:'include'}); const j = await r.json(); return r.ok ? `Terhubung: ${j.provider || 'server'}${j.model?' / '+j.model:''}` : `Gagal (HTTP ${r.status})`; }
    if(c.mode==='ollama'){ const r = await fetch((c.url||'http://localhost:11434').replace(/\/+$/,'') + '/api/tags'); const j = await r.json(); const names = (j.models||[]).map(m=>m.name); return names.includes(c.model) ? `Terhubung. Model ${c.model} tersedia.` : `Terhubung, tetapi model ${c.model} belum ada. Tersedia: ${names.join(', ') || '—'}`; }
    return 'Asisten AI dinonaktifkan.';
  }catch(e){ return c.mode==='ollama' ? 'Tidak bisa menghubungi Ollama. Periksa alamat, dan pastikan OLLAMA_ORIGINS mengizinkan alamat aplikasi ini.' : 'Tidak bisa menghubungi server AI. Periksa alamat endpoint.'; }
}

function buildPrompt(){
  const comp = AI.layer==='computerized';
  return `You are a senior business analyst. Convert the interview notes below into Business Use Cases (BUC).

Context: ${comp ? 'the target is a database-supported business application; inputs and outputs are persistent data entities (records), each with an entity type from: ' + ENTITY_TYPES.join(', ') + '.' : 'the process is manual and paper-based; inputs and outputs are paper business documents (forms, sheets, checklists, slips, registers, records, certificates, notes/letters). Do not describe system actions.'}

Rules:
- Split the process into several simple sequential BUCs when needed. Each BUC has exactly one main actor (a role, never a person's name), one Process Area and one Business Domain.
- Main Flow contains only the normal standard flow, 3-7 steps, each an action by the actor.
- Never refer to another BUC by name or number. Each BUC only lists its own inputs and outputs.
- Inputs = documents/records received, reviewed or referred to. Outputs = documents/records prepared, issued, completed, signed, approved or updated. A document that is received and then signed/approved/updated appears in both lists, with its incoming status on the input and its new status on the output.
- Status is optional; use short past-participle words (Submitted, Approved, Signed, Released, Received, Completed) when a document passes through several states, and keep status words consistent.
- "external" = party outside the organization (Supplier, Customer, Bank, Government Agency…), empty otherwise. "filed": true for an output that is only kept on file.
- Reuse the existing names below exactly whenever they fit; only invent new names when nothing fits.
- current_support: how it is done today per the notes: "Manual", "Spreadsheet", "Application: <name>", "Mixed: <text>" or "Unknown".
- pain_points: only problems actually mentioned in the notes (max 3 per BUC).
- Write all BUC text in ${AI.lang}.

${glossaryForPrompt()}

Reply with only JSON in exactly this shape:
{"bucs":[{"name":"","domain":"","process_area":"","pa_code":"ABC","actor":"","goal":"","start_event":"","main_flow":[""],"inputs":[{"name":"","entity_type":"","status":"","external":""}],"outputs":[{"name":"","entity_type":"","status":"","external":"","filed":false}],"rules":[""],"current_support":"","pain_points":[""]}]}

Interviewee: ${AI.interviewee || '-'} (${AI.role || '-'})
Interview notes:
"""
${AI.notes}
"""`;
}
function fromPackageBuc(x, layer, source){
  const sup = String(x.current_support || '');
  let support = 'Unknown', supportApp = '';
  const m = /^\s*(manual|spreadsheet|application|mixed|not performed|unknown)\s*:?\s*(.*)$/i.exec(sup);
  if(m){ support = SUPPORT.find(s=>s.toLowerCase()===m[1].toLowerCase()) || 'Unknown'; supportApp = m[2]||''; } else if(/excel/i.test(sup)) support='Spreadsheet';
  let inputs = [], outputs = [];
  const io = r => ({name:r.name||'', type:r.entity_type||r.type||'', status:r.status||'', party:r.external||r.party||'', filed:!!r.filed});
  if((x.inputs && x.inputs.length) || (x.outputs && x.outputs.length) || !(x.artifacts && x.artifacts.length)){ inputs = (x.inputs||[]).map(io); outputs = (x.outputs||[]).map(io); }
  else for(const a of x.artifacts||[]){ const u = (a.usage||'R').toUpperCase(); const base = {name:a.name, type:a.entity_type||'', status:'', party:'', filed:false};
    if(/[RU]/.test(u)) inputs.push({...base}); if(/[CU]/.test(u)) outputs.push({...base}); if(u.includes('D')) outputs.push({...base, status:'Cancelled'}); if(u.includes('A')) outputs.push({...base, filed:true}); }
  return normalizeBuc({code: (x.id && /^[A-Z]{2,5}-\d+$/i.test(x.id)) ? x.id : '', name:x.name, layer, domain:x.domain||'', pa:x.process_area||'', paCode:x.pa_code||'', actor:x.actor||'', goal:x.goal||'',
    startEvent:x.start_event||'', flow:x.main_flow||[], inputs, outputs, rules:x.rules||[], support, supportApp, pains:x.pain_points||[], replaces:x.replaces||[],
    source: Object.assign({interviewee:'', role:'', date:''}, source || x.source || {}), review:'draft'});
}

async function renameEverywhere(kind, from, to, artName){
  if(!to || norm(from)===norm(to) && from===to) return;
  const ops = [];
  for(const [id, b0] of S.bucs){
    const b = clone(b0); let ch = false;
    const fix = (obj, key) => { if(norm(obj[key])===norm(from)){ obj[key] = to; ch = true; } };
    if(kind==='domain') fix(b,'domain');
    if(kind==='pa') fix(b,'pa');
    if(kind==='actor') fix(b,'actor');
    if(kind==='art'){ for(const r of [...(b.inputs||[]), ...(b.outputs||[])]) fix(r,'name'); for(const r of b.replaces||[]){ fix(r,'document'); fix(r,'entity'); } }
    if(kind==='status'){ for(const r of [...(b.inputs||[]), ...(b.outputs||[])]) if(norm(r.name)===norm(artName)) fix(r,'status'); }
    if(kind==='paCode' && norm(b.pa)===norm(artName)){ const old = b.paCode; b.paCode = to; if((b.code||'').startsWith(old+'-')) b.code = to + b.code.slice(old.length); ch = true; }
    if(ch) ops.push({id, buc:b});
  }
  if(kind==='art' && S.settings.doc2ent){ const d = Object.assign({}, S.settings.doc2ent); let ch=false; for(const k of Object.keys(d)){ if(norm(k)===norm(from)){ d[to]=d[k]; delete d[k]; ch=true; } if(norm(d[k]||'')===norm(from)){ d[k]=to; ch=true; } } if(ch) await Store.saveSettings({doc2ent:d}); }
  if(kind==='domain' && S.settings.domains[from]){ const d = Object.assign({}, S.settings.domains); d[to] = Object.assign({}, d[from], d[to]||{}); delete d[from]; await Store.saveSettings({domains:d}); }
  if(!ops.length){ toast('Tidak ada yang berubah.'); return; }
  const n = await Store.bulk(ops); toast(`${n} BUC diperbarui.`);
}

async function renameAction(btn){
  const kind = btn.dataset.rn, name = btn.dataset.name, extra = btn.dataset.extra;
  const labels = {art:'dokumen/entity', pa:'process area', actor:'aktor', domain:'domain', status:`status pada ${extra}`, paCode:`kode area ${extra}`};
  const to = await ask({title:`Ganti nama ${labels[kind]}`, body:`Semua BUC yang memakai “${esc(name)}” akan diubah. Jika nama baru sudah ada, keduanya tergabung menjadi satu.`, input:name, okLabel:'Terapkan'});
  if(to===null || !to.trim() || to.trim()===name) return;
  await renameEverywhere(kind, name, kind==='paCode' ? to.trim().toUpperCase() : to.trim(), extra);
}

function viewCrud(main){
  const repo = analyze(); const dc = repo.dclass;
  const cols = new Map(); repo.bucs.forEach(b=>crudOf(b).forEach(a=>{ const k = norm(dc(a.name)); if(!cols.has(k)) cols.set(k, dc(a.name)); }));
  const owner = {}; repo.systems.forEach(s=>s.owns.forEach(o=>owner[norm(o)] = s.id));
  const sysIdx = Object.fromEntries(repo.systems.map((s,i)=>[s.id,i]));
  const keys = [...cols.keys()].sort((a,b)=>((sysIdx[owner[a]] ?? 999) - (sysIdx[owner[b]] ?? 999)) || cols.get(a).localeCompare(cols.get(b)));
  const groups = []; keys.forEach(k=>{ const o = owner[k] || '—'; if(!groups.length || groups[groups.length-1].o!==o) groups.push({o, n:0, first:k}); groups[groups.length-1].n++; });
  const firsts = new Set(groups.map(g=>g.first));
  let h = head('Matriks CRUD', 'Baris: BUC per kandidat sistem. Kolom: kelas data per sistem pemiliknya. C buat, U ubah/setujui, R baca, A arsip. Blok C/U di diagonal menandakan sistem yang kohesif; huruf di luar blok adalah antarmuka antar-sistem.') + `<div class="toolbar">${layerSeg()}</div>`;
  if(!S.bucs.size){ main.innerHTML = h + emptyState(); return; }
  h += `<div class="tablebox"><table class="crud"><thead><tr><th></th>${groups.map(g=>`<th class="sysh" colspan="${g.n}">${g.o}</th>`).join('')}</tr><tr><th>BUC</th>${keys.map(k=>`<th class="col ${firsts.has(k)?'bl':''}" title="${esc(cols.get(k))}">${esc(cols.get(k))}</th>`).join('')}</tr></thead><tbody>`;
  for(const s of repo.systems){
    const rows = s.members.flatMap(m=>repo.pas.get(m).bucs).map(id=>repo.byId[id]); if(!rows.length) continue;
    h += `<tr class="sys"><td colspan="${keys.length+1}">${s.id}, ${s.members.map(m=>esc(repo.pas.get(m).code+' '+repo.pas.get(m).name)).join(' + ')}</td></tr>`;
    for(const b of rows){ const m = {}; crudOf(b).forEach(a=>{ const k = norm(dc(a.name)); m[k] = [...new Set((m[k]||'')+a.usage)].join(''); });
      h += `<tr><td class="rowh">${bucLink(b.id)} ${esc(b.name.length>34 ? b.name.slice(0,33)+'…' : b.name)}</td>${keys.map(k=>{ const u = m[k]||''; const c = u.includes('C')?'C':u.includes('U')?'U':u?'R':''; return `<td class="c ${c} ${firsts.has(k)?'bl':''}">${u}</td>`; }).join('')}</tr>`; }
  }
  main.innerHTML = h + '</tbody></table></div>';
}

function toPackage(layer){
  const repo = analyze(); const list = repo.all.filter(b=>b.layer===layer).sort((a,b)=>String(a.code).localeCompare(b.code));
  return {package:{name:(S.settings.org||'Atlas BUC') + (layer==='manual'?' (as-is)':' (to-be)'), organization:S.settings.org||'', type:layer, version:'3'},
    bucs:list.map(b=>({id:b.code, name:b.name, domain:b.domain, process_area:b.pa, pa_code:b.paCode, actor:b.actor, goal:b.goal, start_event:b.startEvent,
      main_flow:b.flow, inputs:b.inputs.map(r=>({name:r.name, ...(layer==='computerized'?{entity_type:r.type}:{}), status:r.status, external:r.party})),
      outputs:b.outputs.map(r=>({name:r.name, ...(layer==='computerized'?{entity_type:r.type}:{}), status:r.status, external:r.party, filed:r.filed})),
      rules:b.rules, ...(layer==='computerized'?{replaces:b.replaces}:{}), current_support: b.support==='Application'||b.support==='Mixed' ? `${b.support}: ${b.supportApp}` : b.support,
      pain_points:b.pains, source:b.source}))};
}
function toText(list){
  const io = (arr, dir, comp) => arr.map(r=>`- ${r.name}${comp&&r.type?` (${r.type})`:''}${r.status?` [${r.status}]`:''}${r.party?` (${dir==='in'?'from':'to'}: ${r.party})`:''}${r.filed?' (filed)':''}`).join('\n');
  return list.map(b=>{ const comp = b.layer==='computerized';
    return `BUC ${b.code}: ${b.name}\n\nBusiness Domain:\n${b.domain}\n\nProcess Area:\n${b.pa} (${b.paCode})\n\nActor:\n${b.actor}\n\nGoal:\n${b.goal}\n\nMain Flow:\n${b.flow.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n${comp?'Input Data':'Input Documents'}:\n${b.inputs.length?io(b.inputs,'in',comp):`None (starts by ${b.startEvent||'event'})`}\n\n${comp?'Output Data':'Output Documents'}:\n${io(b.outputs,'out',comp)}\n\nBusiness Rules:\n${b.rules.map(r=>'- '+r).join('\n')||'- None stated'}\n\nCurrent Support:\n${b.support}${b.supportApp?': '+b.supportApp:''}\n\nPain Points:\n${b.pains.map(r=>'- '+r).join('\n')||'- None stated'}`; }).join('\n\n---\n\n');
}
function glossaryText(){
  const repo = analyze(); const v = vocab(); const L = ['# BUC Glossary (use these names exactly)', ''];
  for(const d of repo.domains){ L.push(`## Business Domain: ${d.name}`); d.pas.forEach(p=>{ const last = p.bucs.map(id=>repo.byId[id].code).sort().pop(); L.push(`- Process Area: ${p.name} (${p.code}) — last BUC ID used: ${last}`); }); L.push(''); }
  L.push('## Actor roles', ...Object.values(v.actors).map(a=>'- '+a.name).sort(), '', '## Documents and data entities (with statuses)');
  Object.values(v.arts).sort((a,b)=>a.name.localeCompare(b.name)).forEach(a=>L.push(`- ${a.name}${a.types.size?` (${[...a.types][0]})`:''}${a.statuses.size?` — statuses: ${[...a.statuses].join(', ')}`:''}${S.settings.doc2ent&&S.settings.doc2ent[a.name]?` ⇒ ${S.settings.doc2ent[a.name]}`:''}`));
  return L.join('\n');
}

async function exportAction(kind){
  const repo = analyze(); const all = repo.all.slice().sort((a,b)=>String(a.code).localeCompare(b.code));
  if(kind==='pkg-manual') return offerText('Paket BUC as-is (JSON v3)', JSON.stringify(toPackage('manual'), null, 2), 'buc_as-is.json');
  if(kind==='pkg-computerized') return offerText('Paket BUC to-be (JSON v3)', JSON.stringify(toPackage('computerized'), null, 2), 'buc_to-be.json');
  if(kind==='text') return offerText('Teks BUC', toText(all), 'buc.md');
  if(kind==='glossary') return offerText('Glosarium untuk skill BUC', glossaryText(), 'glossary.md');
  if(kind==='backup') return offerText('Cadangan lengkap', JSON.stringify({atlasBackup:1, exported:nowIso(), settings:S.settings, bucs:Object.fromEntries(S.bucs)}, null, 1), 'atlas-buc-backup.json');
}
async function doImport(){
  const msg = $('#impMsg'); let data;
  try{ data = JSON.parse($('#imp').value); }catch(e){ msg.textContent = 'JSON tidak valid.'; return; }
  const skip = $('#impSkip').checked; const existing = new Set([...S.bucs.values()].map(b=>b.code));
  const ops = [];
  if(data && data.atlasBackup){ for(const [id,b] of Object.entries(data.bucs||{})) if(!(skip && existing.has(b.code))) ops.push({id, buc:b}); if(data.settings) await Store.saveSettings(data.settings); }
  else { const pkgs = Array.isArray(data) ? data : [data];
    for(const p of pkgs){ if(!p || !Array.isArray(p.bucs)) continue; const layer = ((p.package||{}).type||'manual').toLowerCase()==='computerized' ? 'computerized' : 'manual';
      for(const x of p.bucs){ const b = fromPackageBuc(x, layer); if(skip && b.code && existing.has(b.code)) continue; if(!b.paCode) b.paCode = deriveCode(b.pa||'Area', new Set(Object.values(paCodeMap())));
        if(!b.code) b.code = b.paCode + '-' + String(ops.filter(o=>o.buc.paCode===b.paCode).length + 1 + Math.max(0,...[...S.bucs.values()].filter(y=>y.paCode===b.paCode).map(y=>seqOf(y.code)).filter(n=>n<999))).padStart(2,'0');
        existing.add(b.code); ops.push({id:uid(), buc:b}); } } }
  if(!ops.length){ msg.textContent = 'Tidak ada BUC baru yang bisa diimpor.'; return; }
  msg.textContent = `Mengimpor ${ops.length} BUC…`; const n = await Store.bulk(ops); msg.textContent = `${n} BUC diimpor.`; $('#imp').value = '';
}

async function loadSample(){
  if(!SAMPLE) return;
  const n = Object.keys(SAMPLE.bucs).length;
  const shared = S.mode==='shared';
  const ok = await ask({title:'Muat data contoh?', body:`${n} BUC contoh pabrik fragrance (PT Aroma Nusantara) akan ditambahkan: campuran as-is manual dan to-be aplikasi, lengkap dengan sambungan, celah, dan kandidat sistem.${shared?' <b>Data ini terlihat oleh semua anggota tim</b> yang membuka aplikasi.':''} BUC contoh diberi tanda “Contoh” dan bisa dihapus sekaligus tanpa menyentuh BUC Anda.`, okLabel:'Muat data contoh'});
  if(!ok) return;
  const ops = Object.entries(SAMPLE.bucs).map(([id,b])=>({id, buc:Object.assign(clone(b), {sample:true})}));
  toast('Memuat data contoh…');
  const done = await Store.bulk(ops);
  const patch = {}; const dom = clone(S.settings.domains||{}); let ch = false;
  for(const [k,v] of Object.entries(SAMPLE.settings.domains||{})) if(!dom[k]){ dom[k] = v; ch = true; }
  if(ch) patch.domains = dom; if(!S.settings.org) patch.org = SAMPLE.settings.org;
  if(Object.keys(patch).length) await Store.saveSettings(patch);
  toast(`${done} BUC contoh dimuat.`); S.layer = 'all'; S.repo = null; go('#/');
}
async function removeSample(){
  const ids = [...S.bucs.entries()].filter(([,b])=>b.sample).map(([id])=>id);
  if(!ids.length){ toast('Tidak ada data contoh.'); return; }
  const ok = await ask({title:`Hapus ${ids.length} BUC contoh?`, body:'Hanya BUC bertanda “Contoh” yang dihapus. BUC hasil wawancara Anda tidak tersentuh.', okLabel:'Hapus data contoh', danger:true});
  if(!ok) return;
  const n = await Store.bulk(ids.map(id=>({id, del:true})));
  if(S.settings.org === (SAMPLE && SAMPLE.settings.org)) await Store.saveSettings({org:''});
  toast(`${n} BUC contoh dihapus.`); render();
}

document.addEventListener('click', async e=>{
  const t = e.target.closest('button, [data-open], [data-go]'); if(!t) return;
  if(t.id==='menuBtn'){ $('#rail').classList.toggle('open'); return; }
  if(t.dataset.go){ e.preventDefault(); go(t.dataset.go); return; }
  if(t.dataset.open){ const id = t.dataset.open; const b = S.bucs.get(id); if(!b) return; if(S.layer!=='all' && b.layer!==S.layer) S.layer='all'; const p = analyze().paOf(id); go('#/area/'+encodeURIComponent(p.code)+'/'+id); return; }
  if(t.dataset.layer){ S.layer = t.dataset.layer; S.repo = null; render(); return; }
  if(t.dataset.newIn){ S.newInPa = t.dataset.newIn; ED = null; go('#/new'); return; }
  if(t.dataset.dup){ const src = S.bucs.get(t.dataset.dup); const b = normalizeBuc(clone(src)); delete b.createdAt; delete b.createdBy; b.code = ''; b.name = b.name + ' (salinan)'; b.review = 'draft'; S.editing = {buc:b}; ED = null; go('#/new'); return; }
  if(t.dataset.ed){ edAction(t); return; }
  if(t.dataset.fix){ applyFix(t.dataset.fix); return; }
  if(t.dataset.ai){ aiAction(t); return; }
  if(t.dataset.aiLayer){ AI.layer = t.dataset.aiLayer; viewInterview($('#main')); return; }
  if(t.dataset.rn){ renameAction(t); return; }
  if(t.dataset.merge){ const ok = await ask({title:'Gabungkan nama?', body:`Semua “${esc(t.dataset.from)}” diganti menjadi “${esc(t.dataset.to)}”.`, okLabel:'Gabungkan'}); if(ok) renameEverywhere(t.dataset.merge, t.dataset.from, t.dataset.to); return; }
  if(t.dataset.exp){ exportAction(t.dataset.exp); return; }
  if(t.dataset.themeSet){ applyTheme(t.dataset.themeSet); return; }
  if(t.dataset.sample==='load'){ if(S.canWrite) loadSample(); return; }
  if(t.dataset.sample==='remove'){ if(S.canWrite) removeSample(); return; }
});
document.addEventListener('keydown', e=>{ const tr = e.target.closest && e.target.closest('tr[data-open]'); if(tr && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); tr.click(); } });
let lastHash = location.hash, restoring = false;
window.addEventListener('hashchange', async ()=>{
  if(restoring){ restoring = false; lastHash = location.hash; return; }
  const leavingEditor = ED && ED.dirty && ED.route === lastHash && location.hash !== lastHash;
  if(leavingEditor){ const target = location.hash; restoring = true; location.hash = lastHash;
    if(await ask({title:'Tinggalkan tanpa menyimpan?', body:'Perubahan pada BUC ini belum disimpan.', okLabel:'Tinggalkan', danger:true})){ ED = null; location.hash = target; } return; }
  if(ED && ED.route !== location.hash) ED = null;
  lastHash = location.hash; render();
});
Store.onChange(()=>{
  const r = parseRoute();
  if(r.name==='new' || r.name==='edit'){ renderNav(); fillDatalists(); renderConn(); return; }
  if(r.name==='interview'){ renderNav(); const ae = document.activeElement; const id = ae && ae.id; const pos = ae && ae.selectionStart;
    if(!AI.busy){ viewInterview($('#main')); if(id){ const el = document.getElementById(id); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } } } return; }
  if(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && r.name!=='map'){ renderNav(); return; }
  render();
});
try{ const t = localStorage.getItem('atlas-theme'); if(t && t!=='auto') document.documentElement.setAttribute('data-theme', t); }catch(e){}
render();
Store.init();
})();

</script>
